services:
  backend:
    build: 
      context: ./backend/core
      dockerfile: Dockerfile
    container_name: django_backend
    volumes:
      # Only map directories that need to persist data
      - ./backend/core/staticfiles:/app/staticfiles
      - ./backend/core/media:/app/media
    expose:
      - "8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=your-secret-key-here
      - DATABASE_URL=postgresql://xrayuser:xraypass@db:5432/xraydb
    depends_on:
      - db
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build: 
      context: ./xraysetu
      dockerfile: Dockerfile
    container_name: next_frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://nginx/api
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_reverse_proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./backend/core/staticfiles:/staticfiles
      - ./backend/core/media:/media
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: xrayuser
      POSTGRES_PASSWORD: xraypass
      POSTGRES_DB: xraydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

volumes:
  postgres_data: